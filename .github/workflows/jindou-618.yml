      max-parallel: 10
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    name: 账号组${{ matrix.index }}

    steps:
      - name: '检出代码'
        uses: actions/checkout@v6

      # --- 环境配置部分  ---
      - name: '设置Python环境'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: '设置Node.js环境'
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: '设置时区为北京时间'
        run: |
          sudo timedatectl set-timezone Asia/Shanghai || true
          echo "当前时间: $(date)"

      - name: '安装依赖'
        run: |
          pip install --upgrade pip
          pip install requests==2.26.0
          pip install lxml==4.6.5
          pip install selenium==3.141.0
          pip install retrying==1.3.3
          pip install wheel==0.37.1
          pip install serverchan_sdk==1.0.6
          pip install PyExecJS
          pip install DrissionPage DataRecorder DownloadKit

      - name: '准备Chrome驱动'
        uses: nanasess/setup-chromedriver@v2

      - name: '安装Xvfb虚拟显示器'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: '启动虚拟显示器'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
        
      - name: '运行查询脚本'
        env:
          DISPLAY: ':99'
        run: |
          echo "正在运行第 ${{ matrix.index }} 组账号..."
          python ./statistics.py "${{ matrix.users }}" "${{ matrix.pwds }}" "true" "${{ matrix.index }}"

      - name: '重命名结果文件'
        if: always()
        run: |
          if [ -f password-changed.txt ]; then
            mv password-changed.txt "password_changed_group${{ matrix.index }}.txt"
          fi

      - name: '上传密码修改记录'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: password_changed_group${{ matrix.index }}.txt
          if-no-files-found: ignore
          archive: false
          retention-days: 5

      - name: '上传查询结果文件供汇总'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: jlc_result_${{ matrix.index }}.json
          if-no-files-found: ignore
          archive: false
          retention-days: 1

