        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.get-excel.outputs.excel_file }}
          if-no-files-found: ignore
          archive: false
          retention-days: 5

      - name: '清理 GitHub 界面的临时 JSON Artifacts'
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            jlc_result_*
          useGlob: true