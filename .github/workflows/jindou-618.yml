          passwords_str = os.environ.get('PASSWORDS_INPUT', '').strip() or os.environ.get('HARDCODED_PASSWORDS', '')
          
          accounts = [x.strip() for x in accounts_str.split(',') if x.strip()]
          passwords = [x.strip() for x in passwords_str.split(',') if x.strip()]

          print(f"Total valid accounts found: {len(accounts)}")
          print(f"Total valid passwords found: {len(passwords)}")

          if len(accounts) != len(passwords):
              print("::error::输入的账号数量与密码数量不一致！工作流将被终止。")
              sys.exit(1)

          if len(accounts) == 0:
              print("::error::未提供有效的账号！")
              sys.exit(1)

          account_pairs = list(zip(accounts, passwords))

          chunk_size = 50
          chunks = []
          total_chunks = math.ceil(len(account_pairs) / chunk_size)

          for i in range(total_chunks):
              batch = account_pairs[i*chunk_size : (i+1)*chunk_size]
              users_str = ",".join([x[0] for x in batch])
              pwds_str = ",".join([x[1] for x in batch])
              
              chunks.append({
                  "index": i + 1,
                  "users": users_str,
                  "pwds": pwds_str
              })

          matrix_json = json.dumps(chunks)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={matrix_json}\n")

  # ==================================================================================
